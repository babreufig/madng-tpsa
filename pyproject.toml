[build-system]
requires = ["scikit-build-core>=0.10", "cffi", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "xgtpsa"
version = "0.1.0"
description = "Python bindings to the GTPSA (truncated power series) engine of MAD-NG"
requires-python = ">=3.9"
dependencies = ["cffi", "numpy"]

[tool.scikit-build]
wheel.packages = ["src/xgtpsa"]
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.sdist]
include = [
  "CMakeLists.txt",
  "madng/src/mad_*.c",
  "madng/src/mad_*.h",
  "madng/src/mad_*.hpp",
  "madng/src/sse/**",
  "madng/src/libgtpsa/mad_*.c",
  "madng/src/libgtpsa/*.h",
  "src/xgtpsa/include/madng_tpsa.h",
]
